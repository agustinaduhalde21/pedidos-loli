<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Celu · El Mundo de Loli</title>
<meta name="theme-color" content="#EA9AB2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loli Celu">
<link rel="icon" href="assets/iso-rosa.png">
<link rel="apple-touch-icon" href="assets/iso-rosa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#3A2F38; --soft:#7d7079; --line:#ece3e8;
  --rosa:#EA9AB2; --rosaD:#C97F9C; --lila:#EFCFE3;
  --celeste:#B3DEE2; --turq:#4E9EA3; --cream:#FCFBF9;
  --verde:#7a9a5f;
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:Quicksand,system-ui,sans-serif;color:var(--ink);background:var(--cream)}
h1{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:21px;margin:4px 0 18px}
button{font-family:Quicksand,system-ui,sans-serif;cursor:pointer}
input,select,textarea{font-family:Quicksand,system-ui,sans-serif;font-size:16px;color:var(--ink)}
::placeholder{color:#b9aeb5}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--rosa)}
.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;margin-bottom:16px;font-size:16px}

.btn-big{width:100%;padding:16px;border-radius:14px;border:none;background:var(--rosa);color:#fff;font-weight:700;font-size:16px;margin-top:6px}
.btn-big:active{background:var(--rosaD)}
.btn-big:disabled{opacity:.6}
.btn-outline{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:15px;margin-top:10px}

.toggle-row{display:flex;align-items:center;gap:12px;margin:18px 0}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#e3d9de;border-radius:999px;transition:.15s}
.slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .slider{background:var(--rosa)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.toggle-row span{font-size:14.5px;font-weight:600}

.sena-fields{border-left:3px solid var(--lila);padding-left:14px;margin-bottom:6px}

.msg{margin-top:14px;font-size:13.5px;text-align:center;min-height:18px}
.msg.ok{color:var(--verde);font-weight:700}
.msg.err{color:#c0546f;font-weight:700}

/* ---- login ---- */
.login-screen{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.login-box{width:100%;max-width:360px;text-align:center}
.login-box img{width:52px;margin-bottom:8px}
.login-box h1{margin-bottom:22px}
.login-box .field{text-align:left}

/* ---- app shell ---- */
#app{display:none;min-height:100%;padding-bottom:88px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;gap:10px}
.topbar .brand{display:flex;align-items:center;gap:9px}
.topbar .brand img{width:26px}
.topbar .brand span{font-family:Fredoka;font-weight:600;font-size:15px}
.btn-logout{border:none;background:transparent;color:var(--soft);font-size:12.5px;font-weight:700;text-decoration:underline;padding:6px}

main{padding:8px 18px 24px}
.panel{display:none}
.panel.active{display:block}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));gap:4px;z-index:40}
.tabbar button{flex:1;background:transparent;border:none;border-radius:12px;padding:9px 4px;font-size:12.5px;font-weight:700;color:var(--soft)}
.tabbar button.active{background:#FBF2F5;color:var(--rosaD)}

/* ---- listas ---- */
.item-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.item-card .ic-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item-card .ic-clienta{font-family:Fredoka;font-weight:600;font-size:15.5px}
.item-card .ic-fecha{font-size:12.5px;color:var(--soft);white-space:nowrap}
.item-card .ic-sub{font-size:12.5px;color:var(--soft);margin-top:4px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.saldo-pend{color:var(--rosaD);font-weight:700}
.saldo-ok{color:var(--verde);font-weight:700}
.empty-note{color:var(--soft);font-size:13.5px;text-align:center;padding:30px 10px}

/* ---- panel de pago (form emergente) ---- */
.pago-form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 6px;margin-top:6px}
.pago-form .pf-clienta{font-family:Fredoka;font-weight:600;font-size:16px;margin-bottom:14px}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img src="assets/iso-rosa.png" alt="">
    <h1>El Mundo de Loli</h1>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button class="btn-big" id="btnLogin" type="button">Entrar</button>
    <div class="msg err" id="loginError"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="topbar">
    <div class="brand"><img src="assets/iso-rosa.png" alt=""><span>El Mundo de Loli</span></div>
    <button class="btn-logout" id="btnLogout" type="button">Cerrar sesión</button>
  </div>

  <main>
    <!-- ---- NUEVO PEDIDO ---- -->
    <section class="panel active" id="panel-nuevo">
      <h1>Nuevo pedido</h1>
      <div class="field"><label>Clienta</label><input id="np_clienta" placeholder="Nombre de la clienta"></div>
      <div class="field"><label>Contacto</label><input id="np_contacto" placeholder="@usuario o número"></div>
      <div class="field"><label>Fecha de entrega</label><input id="np_fecha" type="date"></div>
      <div class="field"><label>Detalle / temática</label><textarea id="np_detalle" rows="3" placeholder="Qué pidió, temática, cantidades…"></textarea></div>

      <div class="toggle-row">
        <label class="switch"><input type="checkbox" id="np_senaToggle"><span class="slider"></span></label>
        <span>¿Recibiste seña?</span>
      </div>

      <div class="sena-fields" id="np_senaFields" style="display:none">
        <div class="field"><label>Monto</label><input id="np_senaMonto" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label>Fecha</label><input id="np_senaFecha" type="date"></div>
        <div class="field">
          <label>Forma de pago</label>
          <select id="np_senaForma">
            <option>Efectivo</option>
            <option>Transferencia</option>
            <option>Mercado Pago</option>
          </select>
        </div>
      </div>

      <button class="btn-big" id="np_guardar" type="button">Guardar pedido</button>
      <div class="msg" id="np_msg"></div>
    </section>

    <!-- ---- REGISTRAR PAGO ---- -->
    <section class="panel" id="panel-pago">
      <h1>Registrar pago</h1>
      <div id="pg_listaWrap">
        <input class="search" id="pg_buscar" placeholder="Buscar clienta…">
        <div id="pg_lista"></div>
      </div>
      <div id="pg_formWrap" style="display:none">
        <div class="pago-form">
          <div class="pf-clienta" id="pf_clienta"></div>
          <div class="field"><label>Monto</label><input id="pf_monto" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
          <div class="field"><label>Fecha</label><input id="pf_fecha" type="date"></div>
          <div class="field">
            <label>Forma de pago</label>
            <select id="pf_forma">
              <option>Efectivo</option>
              <option>Transferencia</option>
              <option>Mercado Pago</option>
            </select>
          </div>
          <div class="field"><label>Nota (opcional)</label><input id="pf_nota" placeholder="Ej: saldo final"></div>
        </div>
        <button class="btn-big" id="pf_guardar" type="button">Guardar pago</button>
        <button class="btn-outline" id="pf_volver" type="button">Volver a la lista</button>
        <div class="msg" id="pg_msg"></div>
      </div>
    </section>

    <!-- ---- AGENDA ---- -->
    <section class="panel" id="panel-agenda">
      <h1>Agenda</h1>
      <input class="search" id="ag_buscar" placeholder="Buscar clienta…">
      <div id="ag_lista"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="nuevo" type="button">Nuevo pedido</button>
    <button class="tab-btn" data-tab="pago" type="button">Registrar pago</button>
    <button class="tab-btn" data-tab="agenda" type="button">Agenda</button>
  </nav>
</div>

<script>
/* ================= CONFIG SUPABASE ================= */
const SUPABASE_URL = 'https://bucngdpeaqpskjjgpaqv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1Y25nZHBlYXFwc2tqamdwYXF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NjY1MjMsImV4cCI6MjEwMDA0MjUyM30.EaVF0UK4Ku0fePijz3zbiVl6IoMWe3H63jEDmtinqss';
const supa = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ================= HELPERS ================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function money(n){
  n = Math.round(Number(n) || 0);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg?'-':'') + '$' + s;
}
function formatDate(iso){
  if(!iso) return '—';
  const p = iso.split('-');
  if(p.length !== 3) return iso;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function escHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeText(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '');
}

const ESTADOS = [
  {id:'pendiente_sena', label:'Pendiente de seña', bg:'#F6DDE6', color:'#C97F9C'},
  {id:'agendado', label:'Agendado', bg:'#E3F0F1', color:'#4E9EA3'},
  {id:'en_diseno', label:'En diseño', bg:'#F8EEF4', color:'#C97F9C'},
  {id:'enviado_aprobacion', label:'Enviado para aprobación', bg:'#EAF6F6', color:'#3E7F84'},
  {id:'aprobado', label:'Aprobado', bg:'#E3F0D9', color:'#7A9A5F'},
  {id:'impreso', label:'Impreso', bg:'#FBF0E4', color:'#B8895A'},
  {id:'armado', label:'Armado', bg:'#F6E6ED', color:'#C97F9C'},
  {id:'listo_entrega', label:'Listo para entrega', bg:'#FBEFD9', color:'#C08A3E'},
  {id:'entregado', label:'Entregado', bg:'#DFF0DA', color:'#5A9A6A'}
];
function estadoInfo(id){ return ESTADOS.find(e=>e.id===id) || {id:'', label: id || '—', bg:'#eee', color:'#888'}; }

function mostrarMsg(el, texto, tipo){
  el.textContent = texto;
  el.className = 'msg' + (tipo ? ' '+tipo : '');
}

/* ================= LOGIN ================= */
async function chequearSesion(){
  if(!supa){
    document.getElementById('loginError').textContent = 'No se pudo conectar con el servidor. Revisá tu conexión.';
    return;
  }
  const { data } = await supa.auth.getSession();
  if(data && data.session) mostrarApp();
  else mostrarLogin();
}
function mostrarApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  cargarAgenda();
}
function mostrarLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
async function hacerLogin(){
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!supa){ errEl.textContent = 'No hay conexión con el servidor.'; return; }
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try{
    const { error } = await supa.auth.signInWithPassword({ email, password });
    if(error) throw error;
    mostrarApp();
  }catch(e){
    errEl.textContent = 'Email o contraseña incorrectos.';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}
document.getElementById('btnLogin').addEventListener('click', hacerLogin);
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') hacerLogin(); });
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  if(supa) await supa.auth.signOut();
  mostrarLogin();
});

/* ================= NAV DE PESTAÑAS ================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'pago') cargarPedidosConSaldo();
    if(btn.dataset.tab === 'agenda') cargarAgenda();
  });
});

/* ================= PANTALLA 1: NUEVO PEDIDO ================= */
document.getElementById('np_fecha').value = '';
document.getElementById('np_senaFecha').value = todayISO();
document.getElementById('np_senaToggle').addEventListener('change', e=>{
  document.getElementById('np_senaFields').style.display = e.target.checked ? 'block' : 'none';
});

document.getElementById('np_guardar').addEventListener('click', async ()=>{
  const msgEl = document.getElementById('np_msg');
  const clienta = document.getElementById('np_clienta').value.trim();
  if(!clienta){ mostrarMsg(msgEl, 'Poné el nombre de la clienta.', 'err'); return; }
  if(!supa){ mostrarMsg(msgEl, 'Sin conexión con el servidor.', 'err'); return; }

  const conSena = document.getElementById('np_senaToggle').checked;
  const payload = {
    clienta,
    contacto: document.getElementById('np_contacto').value.trim(),
    fechaEntrega: document.getElementById('np_fecha').value || null,
    detalle: document.getElementById('np_detalle').value.trim(),
  };
  if(conSena){
    payload.senaMonto = Number(document.getElementById('np_senaMonto').value) || 0;
    payload.senaFecha = document.getElementById('np_senaFecha').value || todayISO();
    payload.senaFormaPago = document.getElementById('np_senaForma').value;
  }

  const btn = document.getElementById('np_guardar');
  btn.disabled = true;
  try{
    const { error } = await supa.from('buzon_capturas').insert({ tipo: 'pedido_nuevo', payload });
    if(error) throw error;
    mostrarMsg(msgEl, 'Guardado. Lo vas a ver en "Revisar capturas del celu" en la PC.', 'ok');
    document.getElementById('np_clienta').value = '';
    document.getElementById('np_contacto').value = '';
    document.getElementById('np_fecha').value = '';
    document.getElementById('np_detalle').value = '';
    document.getElementById('np_senaToggle').checked = false;
    document.getElementById('np_senaFields').style.display = 'none';
    document.getElementById('np_senaMonto').value = '';
    document.getElementById('np_senaFecha').value = todayISO();
  }catch(e){
    mostrarMsg(msgEl, 'No se pudo guardar. Revisá tu conexión e intentá de nuevo.', 'err');
  }
  btn.disabled = false;
});

/* ================= PANTALLA 2: REGISTRAR PAGO ================= */
let pedidosConSaldo = [];
let pedidoSeleccionado = null;

async function cargarPedidosConSaldo(){
  const wrap = document.getElementById('pg_lista');
  if(!supa){ wrap.innerHTML = '<p class="empty-note">Sin conexión con el servidor.</p>'; return; }
  wrap.innerHTML = '<p class="empty-note">Cargando…</p>';
  const { data, error } = await supa.from('agenda_espejo').select('*').gt('saldo', 0).order('fecha_entrega', {ascending:true});
  if(error){ wrap.innerHTML = '<p class="empty-note">No se pudo cargar la agenda. Revisá tu conexión.</p>'; return; }
  pedidosConSaldo = data || [];
  renderListaPago();
}
function renderListaPago(){
  const wrap = document.getElementById('pg_lista');
  const q = normalizeText(document.getElementById('pg_buscar').value);
  const lista = q ? pedidosConSaldo.filter(p=> normalizeText(p.clienta).includes(q)) : pedidosConSaldo;
  if(lista.length === 0){ wrap.innerHTML = '<p class="empty-note">No hay pedidos con saldo pendiente.</p>'; return; }
  wrap.innerHTML = lista.map(p => `
    <div class="item-card" data-id="${p.pedido_id}">
      <div class="ic-top">
        <div class="ic-clienta">${escHTML(p.clienta||'—')}</div>
        <div class="ic-fecha">${formatDate(p.fecha_entrega)}</div>
      </div>
      <div class="ic-sub">
        <span class="badge" style="background:${estadoInfo(p.estado).bg};color:${estadoInfo(p.estado).color}">${estadoInfo(p.estado).label}</span>
        <span class="saldo-pend">${money(p.saldo)}</span>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', ()=> abrirFormPago(card.dataset.id));
  });
}
document.getElementById('pg_buscar').addEventListener('input', renderListaPago);

function abrirFormPago(pedidoId){
  const p = pedidosConSaldo.find(x=>x.pedido_id === pedidoId);
  if(!p) return;
  pedidoSeleccionado = p;
  document.getElementById('pf_clienta').textContent = p.clienta || '—';
  document.getElementById('pf_monto').value = '';
  document.getElementById('pf_fecha').value = todayISO();
  document.getElementById('pf_forma').value = 'Efectivo';
  document.getElementById('pf_nota').value = '';
  document.getElementById('pg_msg').textContent = '';
  document.getElementById('pg_listaWrap').style.display = 'none';
  document.getElementById('pg_formWrap').style.display = 'block';
}
document.getElementById('pf_volver').addEventListener('click', ()=>{
  document.getElementById('pg_formWrap').style.display = 'none';
  document.getElementById('pg_listaWrap').style.display = 'block';
});
document.getElementById('pf_guardar').addEventListener('click', async ()=>{
  const msgEl = document.getElementById('pg_msg');
  const monto = Number(document.getElementById('pf_monto').value) || 0;
  if(!pedidoSeleccionado){ return; }
  if(monto <= 0){ mostrarMsg(msgEl, 'Poné un monto mayor a 0.', 'err'); return; }
  if(!supa){ mostrarMsg(msgEl, 'Sin conexión con el servidor.', 'err'); return; }

  const payload = {
    pedidoId: pedidoSeleccionado.pedido_id,
    clienta: pedidoSeleccionado.clienta,
    monto,
    fecha: document.getElementById('pf_fecha').value || todayISO(),
    formaPago: document.getElementById('pf_forma').value,
    nota: document.getElementById('pf_nota').value.trim()
  };

  const btn = document.getElementById('pf_guardar');
  btn.disabled = true;
  try{
    const { error } = await supa.from('buzon_capturas').insert({ tipo: 'pago', payload });
    if(error) throw error;
    mostrarMsg(msgEl, 'Pago guardado. Lo vas a ver en "Revisar capturas del celu" en la PC.', 'ok');
    setTimeout(()=>{
      document.getElementById('pg_formWrap').style.display = 'none';
      document.getElementById('pg_listaWrap').style.display = 'block';
      cargarPedidosConSaldo();
    }, 900);
  }catch(e){
    mostrarMsg(msgEl, 'No se pudo guardar. Revisá tu conexión e intentá de nuevo.', 'err');
  }
  btn.disabled = false;
});

/* ================= PANTALLA 3: AGENDA (solo lectura) ================= */
let agendaCompleta = [];

async function cargarAgenda(){
  const wrap = document.getElementById('ag_lista');
  if(!supa){ wrap.innerHTML = '<p class="empty-note">Sin conexión con el servidor.</p>'; return; }
  wrap.innerHTML = '<p class="empty-note">Cargando…</p>';
  const { data, error } = await supa.from('agenda_espejo').select('*').order('fecha_entrega', {ascending:true});
  if(error){ wrap.innerHTML = '<p class="empty-note">No se pudo cargar la agenda. Revisá tu conexión.</p>'; return; }
  agendaCompleta = data || [];
  renderAgenda();
}
function renderAgenda(){
  const wrap = document.getElementById('ag_lista');
  const q = normalizeText(document.getElementById('ag_buscar').value);
  const lista = q ? agendaCompleta.filter(p=> normalizeText(p.clienta).includes(q)) : agendaCompleta;
  if(lista.length === 0){ wrap.innerHTML = '<p class="empty-note">No hay pedidos cargados.</p>'; return; }
  wrap.innerHTML = lista.map(p => `
    <div class="item-card">
      <div class="ic-top">
        <div class="ic-clienta">${escHTML(p.clienta||'—')}</div>
        <div class="ic-fecha">${formatDate(p.fecha_entrega)}</div>
      </div>
      <div class="ic-sub">
        <span class="badge" style="background:${estadoInfo(p.estado).bg};color:${estadoInfo(p.estado).color}">${estadoInfo(p.estado).label}</span>
        <span class="${p.saldo > 0.009 ? 'saldo-pend' : 'saldo-ok'}">${money(p.saldo)}</span>
      </div>
    </div>
  `).join('');
}
